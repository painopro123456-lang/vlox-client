name: Windows Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Run Rust tests
        run: cargo test --target x86_64-pc-windows-msvc

      - name: Build release executable
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Publish direct EXE release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: VLOX CLIENT - Latest Windows Build
          prerelease: true
          make_latest: false
          files: target/x86_64-pc-windows-msvc/release/vlox-client.exe
          fail_on_unmatched_files: true

      - name: Upload workflow copy
        uses: actions/upload-artifact@v4
        with:
          name: VLOX-CLIENT-Windows-x64-EXE
          path: target/x86_64-pc-windows-msvc/release/vlox-client.exe
          if-no-files-found: error
          compression-level: 0
