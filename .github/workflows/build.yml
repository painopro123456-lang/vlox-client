name: Build VLOX CLIENT
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build VLOX Desktop
        run: cargo build --release
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: VLOX-CLIENT-Windows-x64-EXE
          path: target/release/vlox-client.exe
          if-no-files-found: error
  fabric-mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Fabric mod
        working-directory: client-mod
        run: gradle build
      - name: Upload Fabric mod
        uses: actions/upload-artifact@v4
        with:
          name: VLOX-CLIENT-Fabric-1.21.1
          path: client-mod/build/libs/vlox-client-mod-0.1.0.jar
          if-no-files-found: error
