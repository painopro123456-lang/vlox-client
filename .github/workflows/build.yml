name: Build VLOX CLIENT
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Build bundled VLOX Fabric mod
        working-directory: client-mod
        run: gradle build
      - name: Download bundled Fabric API
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force client-mod/build/libs | Out-Null
          Invoke-WebRequest -Uri 'https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/0.161.0+26.2/fabric-api-0.161.0+26.2.jar' -OutFile 'client-mod/build/libs/fabric-api-0.161.0+26.2.jar'
          if ((Get-Item 'client-mod/build/libs/fabric-api-0.161.0+26.2.jar').Length -lt 1000000) { throw 'Fabric API download is unexpectedly small.' }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build VLOX Desktop (static Visual C++ runtime)
        env:
          RUSTFLAGS: -C target-feature=+crt-static
          VLOX_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: cargo build --release
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: VLOX-CLIENT-Windows-x64-EXE
          path: target/release/vlox-client.exe
          if-no-files-found: error

  fabric-mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Build Fabric mod for Minecraft 26.2
        working-directory: client-mod
        run: gradle build
      - name: Upload Fabric 26.2 mod
        uses: actions/upload-artifact@v4
        with:
          name: VLOX-CLIENT-Fabric-26.2
          path: client-mod/build/libs/vlox-client-mod-0.1.0.jar
          if-no-files-found: error
